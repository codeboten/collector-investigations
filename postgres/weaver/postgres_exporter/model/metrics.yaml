file_format: definition/2
metrics:
  - name: pg_up
    brief: "Whether the last scrape could reach the server."
    stability: development
    requirement_level: recommended
    instrument: gauge
    unit: "1"
  - name: pg_postmaster_start_time_seconds
    brief: "Postmaster start time (unix)."
    stability: development
    requirement_level: recommended
    instrument: gauge
    unit: "s"
  - name: pg_database_size_bytes
    brief: "Database size."
    stability: development
    requirement_level: recommended
    instrument: gauge
    unit: "By"
    attributes:
      - ref: datname
        requirement_level: recommended
    annotations:
      postgresql_receiver_equivalent: "postgresql.db_size"
  - name: pg_stat_database_numbackends
    brief: "Connected backends."
    stability: development
