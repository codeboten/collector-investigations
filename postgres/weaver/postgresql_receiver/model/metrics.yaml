    brief: "WAL lag by operation."
    stability: development
    requirement_level: recommended
    instrument: gauge
    unit: "s"
    attributes:
      - ref: operation
        requirement_level: recommended
      - ref: replication_client
        requirement_level: recommended
    annotations:
      enabled_by_default: true
