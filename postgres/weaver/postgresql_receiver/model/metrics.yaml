      enabled_by_default: false
  - name: postgresql.wal.age
    brief: "Age of the oldest unarchived WAL file."
    stability: development
    requirement_level: recommended
    instrument: gauge
    unit: "s"
    annotations:
      enabled_by_default: true
  - name: postgresql.wal.delay
    brief: "WAL delay by operation."
    stability: development
    requirement_level: recommended
    instrument: gauge
    unit: "s"
    attributes:
      - ref: operation
        requirement_level: recommended
      - ref: replication_client
        requirement_level: recommended
